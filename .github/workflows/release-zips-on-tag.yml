name: Build and Release ZIPs (Tag)

on:
  push:
    tags:
      # Keep the existing date-tag formats and explicitly trigger rollback tags.
      - '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'
      - '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_[0-9][0-9][0-9][0-9][0-9][0-9]'
      - 'v1-rollback-v2.*'

permissions:
  actions: write
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      release_kind: ${{ steps.tag.outputs.release_kind }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      release_name: ${{ steps.tag.outputs.release_name }}
    steps:
      - id: tag
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME:-}"
          REF_TYPE="${GITHUB_REF_TYPE:-}"

          if [[ "$REF_TYPE" != "tag" || -z "$TAG" ]]; then
            echo "Ref invalida para release: type='$REF_TYPE' name='$TAG'" >&2
            exit 1
          fi

          if [[ "$TAG" =~ ^[0-9]{8}(_[0-9]{6})?$ ]]; then
            RELEASE_KIND="date"
            PRERELEASE="false"
            RELEASE_NAME="MrBot $TAG"
          elif [[ "$TAG" =~ ^v1-rollback-v2\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            RELEASE_KIND="rollback"
            if [[ "$TAG" =~ -rc\.[0-9]+$ ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
            RELEASE_NAME="MrBot rollback ${TAG#v1-rollback-}"
          else
            echo "Tag invalida: '$TAG'" >&2
            echo "Formatos esperados: YYYYMMDD, YYYYMMDD_HHMMSS o v1-rollback-v2.X.Y[-rc.N]" >&2
            exit 1
          fi

          {
            printf 'version=%s\n' "$TAG"
            printf 'release_kind=%s\n' "$RELEASE_KIND"
            printf 'prerelease=%s\n' "$PRERELEASE"
            printf 'release_name=%s\n' "$RELEASE_NAME"
          } >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux ZIP
    needs: validate-tag
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.validate-tag.outputs.version }}
      RELEASE_KIND: ${{ needs.validate-tag.outputs.release_kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable (Linux)
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Package ZIP (Linux)
        run: |
          set -euo pipefail
          ZIP_NAME="mrbot-refactored.${APP_VERSION}.Linux.zip"
          PACKAGE_DIR="$RUNNER_TEMP/package-linux"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"

          test -f "Ejecutable/mrbot" || {
            echo "No se encontro Ejecutable/mrbot" >&2
            exit 1
          }
          test -d "Ejecutable/bin" || {
            echo "No se encontro Ejecutable/bin" >&2
            exit 1
          }

          cp -a "Ejecutable/mrbot" "$PACKAGE_DIR/"
          cp -a "Ejecutable/bin" "$PACKAGE_DIR/bin"

          if [ -d "Ejecutable/ejemplos_api" ]; then
            cp -a "Ejecutable/ejemplos_api" "$PACKAGE_DIR/ejemplos_api"
          fi

          # Never copy a real .env into a release package.
          (
            cd "$PACKAGE_DIR"
            zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" .
          )

          test -s "$GITHUB_WORKSPACE/$ZIP_NAME"
          (
            cd "$GITHUB_WORKSPACE"
            sha256sum "$ZIP_NAME"
          ) > "$GITHUB_WORKSPACE/$ZIP_NAME.sha256"
          test -s "$GITHUB_WORKSPACE/$ZIP_NAME.sha256"

      - name: Scan packaged files for secrets (portable, fail-closed)
        run: |
          set -euo pipefail
          python .github/scripts/scan_release_secrets.py "$RUNNER_TEMP/package-linux"

      - name: Upload Linux ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-zip-${{ env.RELEASE_KIND }}
          path: |
            mrbot-refactored.${{ env.APP_VERSION }}.Linux.zip
            mrbot-refactored.${{ env.APP_VERSION }}.Linux.zip.sha256
          if-no-files-found: error

  build-windows:
    name: Build Windows ZIP
    needs: validate-tag
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.validate-tag.outputs.version }}
      RELEASE_KIND: ${{ needs.validate-tag.outputs.release_kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable (Windows)
        shell: pwsh
        run: |
          .\build_windows.ps1

      - name: Package ZIP (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipName = "mrbot-refactored.$env:APP_VERSION.Windows.zip"
          $packageDir = Join-Path $env:RUNNER_TEMP "package-windows"

          if (Test-Path -LiteralPath $packageDir) {
            Remove-Item -LiteralPath $packageDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $packageDir | Out-Null

          if (Test-Path -LiteralPath ".\Ejecutable\mrbot.exe" -PathType Leaf) {
            Copy-Item ".\Ejecutable\mrbot.exe" $packageDir -Force
          }
          elseif (Test-Path -LiteralPath ".\Ejecutable\mrbot" -PathType Leaf) {
            Copy-Item ".\Ejecutable\mrbot" $packageDir -Force
          }
          else {
            throw "No se encontro ejecutable en .\Ejecutable"
          }

          if (Test-Path -LiteralPath ".\Ejecutable\bin" -PathType Container) {
            Copy-Item ".\Ejecutable\bin" (Join-Path $packageDir "bin") -Recurse -Force
          }
          else {
            throw "No se encontro .\Ejecutable\bin"
          }

          if (Test-Path -LiteralPath ".\Ejecutable\ejemplos_api" -PathType Container) {
            Copy-Item ".\Ejecutable\ejemplos_api" (Join-Path $packageDir "ejemplos_api") -Recurse -Force
          }

          # Never copy a real .env into a release package.
          $destZip = Join-Path $env:GITHUB_WORKSPACE $zipName
          if (Test-Path -LiteralPath $destZip) {
            Remove-Item -LiteralPath $destZip -Force
          }

          $itemsToZip = Get-ChildItem -LiteralPath $packageDir -Force | ForEach-Object { $_.FullName }
          if (-not $itemsToZip) {
            throw "No hay archivos para comprimir en $packageDir"
          }

          Compress-Archive -Path $itemsToZip -DestinationPath $destZip -Force
          if (-not (Test-Path -LiteralPath $destZip -PathType Leaf)) {
            throw "No se genero el ZIP $destZip"
          }

          $hash = (Get-FileHash -LiteralPath $destZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$destZip.sha256"
          "{0}  {1}" -f $hash, $zipName | Set-Content -LiteralPath $checksumPath -Encoding ascii
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
            throw "No se genero el checksum $checksumPath"
          }

      - name: Scan packaged files for secrets (portable, fail-closed)
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "package-windows"
          & python ".\.github\scripts\scan_release_secrets.py" $packageDir
          if ($LASTEXITCODE -ne 0) {
            throw "El escaneo de secretos fallo o no pudo completarse"
          }

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-zip-${{ env.RELEASE_KIND }}
          path: |
            mrbot-refactored.${{ env.APP_VERSION }}.Windows.zip
            mrbot-refactored.${{ env.APP_VERSION }}.Windows.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - validate-tag
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Create/Update release and upload ZIPs
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.validate-tag.outputs.release_name }}
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.zip
            release-assets/**/*.sha256

      - name: Delete workflow artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const artifactNames = new Set([
              "linux-zip-${{ needs.validate-tag.outputs.release_kind }}",
              "windows-zip-${{ needs.validate-tag.outputs.release_kind }}",
            ]);
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });

            const artifacts = data.artifacts.filter(({ name }) => artifactNames.has(name));

            if (artifacts.length === 0) {
              core.info("No matching artifacts found to delete.");
              return;
            }

            for (const artifact of artifacts) {
              core.info(`Deleting artifact ${artifact.name} (${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
