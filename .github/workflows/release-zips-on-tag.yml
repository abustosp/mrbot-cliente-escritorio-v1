name: Build and Release ZIPs (Tag)

on:
  push:
    tags:
      - '*'

permissions:
  actions: write
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^[0-9]{8}(_[0-9]{6})?$ ]]; then
            echo "Tag invalida: '$TAG'"
            echo "Formato esperado: YYYYMMDD o YYYYMMDD_HHMMSS (ej: 20260223 o 20260223_062352)"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux ZIP
    needs: validate-tag
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable (Linux)
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Package ZIP (Linux)
        run: |
          ZIP_NAME="mrbot-refactored.${APP_VERSION}.Linux.zip"
          PACKAGE_DIR="$RUNNER_TEMP/package-linux"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"

          cp -a "Ejecutable/mrbot" "$PACKAGE_DIR/"
          cp -a "Ejecutable/bin" "$PACKAGE_DIR/bin"

          if [ -d "Ejecutable/ejemplos_api" ]; then
            cp -a "Ejecutable/ejemplos_api" "$PACKAGE_DIR/ejemplos_api"
          fi

          if [ -f "Ejecutable/.env" ]; then
            cp -a "Ejecutable/.env" "$PACKAGE_DIR/.env"
          fi

          (
            cd "$PACKAGE_DIR"
            zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" .
          )

      - name: Upload Linux ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: mrbot-refactored.${{ env.APP_VERSION }}.Linux.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows ZIP
    needs: validate-tag
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable (Windows)
        shell: pwsh
        run: |
          .\build_windows.ps1

      - name: Package ZIP (Windows)
        shell: pwsh
        run: |
          $zipName = "mrbot-refactored.$env:APP_VERSION.Windows.zip"
          $packageDir = Join-Path $env:RUNNER_TEMP "package-windows"

          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $packageDir | Out-Null

          if (Test-Path ".\Ejecutable\mrbot.exe") {
            Copy-Item ".\Ejecutable\mrbot.exe" $packageDir -Force
          }
          elseif (Test-Path ".\Ejecutable\mrbot") {
            Copy-Item ".\Ejecutable\mrbot" $packageDir -Force
          }
          else {
            throw "No se encontro ejecutable en .\Ejecutable"
          }

          if (Test-Path ".\Ejecutable\bin") {
            Copy-Item ".\Ejecutable\bin" (Join-Path $packageDir "bin") -Recurse -Force
          }

          if (Test-Path ".\Ejecutable\ejemplos_api") {
            Copy-Item ".\Ejecutable\ejemplos_api" (Join-Path $packageDir "ejemplos_api") -Recurse -Force
          }

          if (Test-Path ".\Ejecutable\.env") {
            Copy-Item ".\Ejecutable\.env" (Join-Path $packageDir ".env") -Force
          }

          $destZip = Join-Path $env:GITHUB_WORKSPACE $zipName
          if (Test-Path $destZip) {
            Remove-Item $destZip -Force
          }

          $itemsToZip = Get-ChildItem -Path $packageDir -Force | ForEach-Object { $_.FullName }
          if (-not $itemsToZip) {
            throw "No hay archivos para comprimir en $packageDir"
          }

          Compress-Archive -Path $itemsToZip -DestinationPath $destZip -Force

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: mrbot-refactored.${{ env.APP_VERSION }}.Windows.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - validate-tag
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create/Update release and upload ZIPs
        uses: softprops/action-gh-release@v2
        with:
          name: MrBot ${{ needs.validate-tag.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.zip

      - name: Delete workflow artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifactNames = new Set(["linux-zip", "windows-zip"]);
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });

            const artifacts = data.artifacts.filter(({ name }) => artifactNames.has(name));

            if (artifacts.length === 0) {
              core.info("No matching artifacts found to delete.");
              return;
            }

            for (const artifact of artifacts) {
              core.info(`Deleting artifact ${artifact.name} (${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
